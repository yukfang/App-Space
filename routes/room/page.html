<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
    #board { flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; padding: 16px; min-height: 0; }
    .col { background: #fff; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.06); display: flex; flex-direction: column; min-height: 0; }
    .col-head { padding: 10px 14px; font-weight: 700; font-size: 13px; color: #1d2129; border-bottom: 1px solid #e3e6ea; letter-spacing: 1px; }
    .col-input { padding: 10px 12px; border-bottom: 1px solid #e3e6ea; }
    #txtInput { width: 100%; height: 90px; border: 1px solid #e3e6ea; border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.5; resize: none; outline: none; font-family: inherit; }
    #txtInput:focus { border-color: #4080ff; }
    .dropzone { height: 90px; margin: 10px 12px; border: 2px dashed #d5d8dd; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; color: #86909c; font-size: 13px; cursor: pointer; transition: border-color .15s, background .15s; }
    .dropzone:hover { border-color: #4080ff; color: #4080ff; }
    .dropzone.over { border-color: #4080ff; background: #e8f1ff; color: #4080ff; }
    .col-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .empty { text-align: center; color: #c9cdd4; font-size: 13px; margin: 20px 0; }
    .item { background: #f7f8fa; border-radius: 8px; padding: 8px 10px; position: relative; }
    .item .text { font-size: 14px; color: #1d2129; white-space: pre-wrap; word-break: break-word; }
    .item img { max-width: 100%; max-height: 220px; border-radius: 6px; display: block; cursor: zoom-in; }
    .item .fname { font-size: 13px; color: #1d2129; word-break: break-all; }
    .item .fsize { font-size: 11px; color: #86909c; margin-top: 2px; }
    .item .row { display: flex; align-items: flex-start; gap: 8px; padding-right: 64px; }
    .item .actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
    .item button { border: 1px solid #e3e6ea; background: #fff; border-radius: 6px; padding: 4px; cursor: pointer; color: #4e5969; display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
    .item button svg { display: block; }
    .item button:hover { border-color: #4080ff; color: #4080ff; }
    .item button.del:hover { border-color: #f53f3f; color: #f53f3f; }
    #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #1d2129; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 10; }
    @media (max-width: 800px) {
        #board { grid-template-columns: 1fr; overflow-y: auto; }
        .col { max-height: 34vh; }
        .item img { max-height: 180px; }
    }
</style>
</head>
<body>
<div id="board">
    <section class="col" id="col-txt">
        <div class="col-head">TXT</div>
        <div class="col-input">
            <textarea id="txtInput" placeholder="Type text, press Enter to send"></textarea>
        </div>
        <div class="col-body"><div class="empty">暂无</div></div>
    </section>
    <section class="col" id="col-image">
        <div class="col-head">IMAGE</div>
        <div class="dropzone" id="dzImage">
            <div>Click or drag to upload images</div>
            <input type="file" id="fileImage" accept="image/*" multiple style="display:none">
        </div>
        <div class="col-body"><div class="empty">暂无</div></div>
    </section>
    <section class="col" id="col-file">
        <div class="col-head">FILE</div>
        <div class="dropzone" id="dzFile">
            <div>Click or drag to upload files</div>
            <input type="file" id="fileAny" multiple style="display:none">
        </div>
        <div class="col-body"><div class="empty">暂无</div></div>
    </section>
</div>
<div id="toast"></div>
<script>
(function () {
    const MAX_FILE_BYTES = 25 * 1024 * 1024;
    const roomName = decodeURIComponent(location.pathname.replace(/^\/room\//, '')).replace(/\/+$/, '');
    const sender = (crypto.randomUUID) ? crypto.randomUUID() : 'client-' + Math.random().toString(36).slice(2);

    const cols = {
        text: document.getElementById('col-txt').querySelector('.col-body'),
        image: document.getElementById('col-image').querySelector('.col-body'),
        file: document.getElementById('col-file').querySelector('.col-body')
    };
    const txtInputEl = document.getElementById('txtInput');
    const toastEl = document.getElementById('toast');

    let es = null;

    function connect() {
        es = new EventSource('/room/' + encodeURIComponent(roomName) + '/events');
        es.addEventListener('snapshot', function (e) {
            const messages = JSON.parse(e.data);
            Object.keys(cols).forEach(function (t) {
                cols[t].innerHTML = '<div class="empty">暂无</div>';
            });
            messages.forEach(render);
        });
        es.addEventListener('message', function (e) {
            const data = JSON.parse(e.data);
            if (data.op === 'add' || data.op === 'update') upsert(data.message);
            else if (data.op === 'delete') remove(data.message.id);
        });
    }

    const ICON_COPY = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5v-1a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1"/></svg>';
    const ICON_TRASH = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 4h10M6.5 4V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1M5 4l.5 8.5a1 1 0 0 0 1 .9h3a1 1 0 0 0 1-.9L11 4"/></svg>';
    const ICON_DOWNLOAD = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8 2v8"/><path d="M4.5 6.5 8 10l3.5-3.5"/><path d="M3 12.5h10"/></svg>';

    function emptyCol(t) {
        if (!cols[t].querySelector('.item')) {
            cols[t].innerHTML = '<div class="empty">暂无</div>';
        }
    }

    function iconButton(icon, title, handler, isDel) {
        const btn = document.createElement('button');
        btn.title = title;
        if (isDel) btn.className = 'del';
        btn.innerHTML = icon;
        btn.addEventListener('click', handler);
        return btn;
    }

    function delButton(id) {
        return iconButton(ICON_TRASH, '删除', function () { sendOp({ op: 'delete', id: id }); }, true);
    }

    function actionButton(icon, title, handler) {
        return iconButton(icon, title, handler, false);
    }

    function render(m) {
        const col = cols[m.type];
        if (!col) return;
        const item = document.createElement('div');
        item.className = 'item';
        item.dataset.id = m.id;
        item.dataset.time = m.createdAt || 0;

        const body = document.createElement('div');
        if (m.type === 'text') {
            body.className = 'text';
            body.textContent = m.content;
        } else if (m.type === 'image') {
            const a = document.createElement('a');
            a.href = m.url;
            a.target = '_blank';
            const img = document.createElement('img');
            img.src = m.url;
            img.loading = 'lazy';
            img.alt = m.name || 'image';
            a.appendChild(img);
            body.appendChild(a);
        } else if (m.type === 'file') {
            const fname = document.createElement('div');
            fname.className = 'fname';
            fname.textContent = m.name;
            const fsize = document.createElement('div');
            fsize.className = 'fsize';
            fsize.textContent = formatSize(m.size);
            body.appendChild(fname);
            body.appendChild(fsize);
        }

        const row = document.createElement('div');
        row.className = 'row';
        row.appendChild(body);
        const actions = document.createElement('div');
        actions.className = 'actions';
        if (m.type === 'text') {
            actions.appendChild(actionButton(ICON_COPY, '复制', function () { copyText(m.content); }));
        } else if (m.type === 'image') {
            actions.appendChild(actionButton(ICON_COPY, '复制', function () { copyImage(m.url); }));
        } else if (m.type === 'file') {
            actions.appendChild(actionButton(ICON_DOWNLOAD, '下载', function () { downloadFile(m.url, m.name); }));
        }
        actions.appendChild(delButton(m.id));
        row.appendChild(actions);
        item.appendChild(row);

        const empty = col.querySelector('.empty');
        if (empty) empty.remove();
        col.appendChild(item);
        sortColumn(col);
    }

    function sortColumn(col) {
        const items = Array.prototype.slice.call(col.querySelectorAll('.item'));
        items.sort(function (a, b) { return Number(b.dataset.time) - Number(a.dataset.time); });
        items.forEach(function (it) { col.appendChild(it); });
    }

    function upsert(m) {
        const col = cols[m.type];
        if (!col) return;
        const existing = col.querySelector('.item[data-id="' + m.id + '"]');
        if (existing) {
            const textEl = existing.querySelector('.text');
            if (textEl) textEl.textContent = m.content;
            return;
        }
        render(m);
    }

    function remove(id) {
        const el = document.querySelector('.item[data-id="' + id + '"]');
        if (!el) return;
        const col = el.parentNode;
        el.remove();
        emptyCol(col.id === 'col-txt' ? 'text' : (col.id === 'col-image' ? 'image' : 'file'));
    }

    function copyText(t) {
        navigator.clipboard.writeText(t).then(function () { toast('已复制'); }).catch(function () { toast('复制失败'); });
    }

    async function copyImage(url) {
        try {
            const res = await fetch(url);
            const blob = await res.blob();
            const type = blob.type || 'image/png';
            await navigator.clipboard.write([new ClipboardItem({ [type]: blob })]);
            toast('已复制图片');
        } catch (e) {
            try {
                await navigator.clipboard.writeText(url);
                toast('已复制图片地址');
            } catch (e2) {
                toast('复制失败');
            }
        }
    }

    function downloadFile(url, name) {
        const a = document.createElement('a');
        a.href = url;
        a.download = name || 'file';
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    async function sendOp(payload) {
        payload.sender = sender;
        try {
            const res = await fetch('/room/' + encodeURIComponent(roomName) + '/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                const data = await res.json().catch(function () { return {}; });
                toast(data.error || '操作失败');
            }
        } catch (e) {
            toast('网络错误');
        }
    }

    function sendText() {
        const content = txtInputEl.value.trim();
        if (!content) return;
        txtInputEl.value = '';
        txtInputEl.style.height = '';
        sendOp({ op: 'add', type: 'text', content: content });
    }

    txtInputEl.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' && !ev.shiftKey) {
            ev.preventDefault();
            sendText();
        }
    });

    function bindDropZone(zoneEl, inputEl, accept) {
        let counter = 0;
        zoneEl.addEventListener('click', function () { inputEl.click(); });
        zoneEl.addEventListener('dragenter', function (e) { e.preventDefault(); counter++; zoneEl.classList.add('over'); });
        zoneEl.addEventListener('dragover', function (e) { e.preventDefault(); });
        zoneEl.addEventListener('dragleave', function () { counter = Math.max(0, counter - 1); if (counter === 0) zoneEl.classList.remove('over'); });
        zoneEl.addEventListener('drop', function (e) {
            e.preventDefault();
            counter = 0;
            zoneEl.classList.remove('over');
            const files = Array.prototype.slice.call(e.dataTransfer.files).filter(function (f) {
                return !accept || f.type.indexOf('image/') === 0;
            });
            if (!files.length) { toast('请拖入图片文件'); return; }
            files.forEach(function (f) { uploadFile(f, accept ? 'image' : 'file'); });
        });
        inputEl.addEventListener('change', function (e) {
            const files = Array.prototype.slice.call(e.target.files);
            e.target.value = '';
            files.forEach(function (f) { uploadFile(f, accept ? 'image' : 'file'); });
        });
    }

    bindDropZone(document.getElementById('dzImage'), document.getElementById('fileImage'), true);
    bindDropZone(document.getElementById('dzFile'), document.getElementById('fileAny'), false);

    // prevent the browser from opening files dropped outside the zones
    ['dragover', 'drop'].forEach(function (ev) {
        window.addEventListener(ev, function (e) {
            if (!e.target.closest || !e.target.closest('.dropzone')) e.preventDefault();
        });
    });

    async function uploadFile(file, type) {
        if (file.size > MAX_FILE_BYTES) { toast('文件不能超过 25MB'); return; }
        let b64;
        try {
            b64 = await readAsBase64(file);
        } catch (e) {
            toast('读取文件失败');
            return;
        }
        sendOp({ op: 'add', type: type, content: b64, name: file.name, mime: file.type || 'application/octet-stream' });
    }

    function readAsBase64(file) {
        return new Promise(function (resolve, reject) {
            const reader = new FileReader();
            reader.onload = function () { resolve(String(reader.result).split(',')[1]); };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function formatSize(n) {
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
        return (n / 1024 / 1024).toFixed(1) + ' MB';
    }

    let toastTimer;
    function toast(msg) {
        toastEl.textContent = msg;
        toastEl.style.display = 'block';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.style.display = 'none'; }, 2500);
    }

    window.addEventListener('beforeunload', function () { if (es) es.close(); });

    connect();
})();
</script>
</body>
</html>
