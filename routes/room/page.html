<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
    #board { flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; padding: 16px; min-height: 0; }
    .col { background: #fff; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.06); display: flex; flex-direction: column; min-height: 0; }
    .col-head { padding: 10px 14px; font-weight: 700; font-size: 13px; color: #1d2129; border-bottom: 1px solid #e3e6ea; letter-spacing: 1px; }
    .col-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .empty { text-align: center; color: #c9cdd4; font-size: 13px; margin: 20px 0; }
    .item { background: #f7f8fa; border-radius: 8px; padding: 8px 10px; }
    .item .meta { font-size: 11px; color: #86909c; margin-bottom: 4px; }
    .item .meta .sender { font-weight: 600; color: #4e5969; }
    .item .text { font-size: 14px; color: #1d2129; white-space: pre-wrap; word-break: break-word; }
    .item img { max-width: 100%; max-height: 220px; border-radius: 6px; display: block; cursor: zoom-in; }
    .item .fname { font-size: 13px; color: #1d2129; word-break: break-all; }
    .item .fsize { font-size: 11px; color: #86909c; margin-top: 2px; }
    .item .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .item .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .item button { border: 1px solid #e3e6ea; background: #fff; border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; color: #4e5969; }
    .item button:hover { border-color: #4080ff; color: #4080ff; }
    .item button.del:hover { border-color: #f53f3f; color: #f53f3f; }
    footer { background: #fff; border-top: 1px solid #e3e6ea; padding: 10px 16px; display: flex; gap: 8px; align-items: center; }
    #input { flex: 1; border: 1px solid #e3e6ea; border-radius: 8px; padding: 8px 12px; font-size: 14px; resize: none; outline: none; font-family: inherit; }
    #input:focus { border-color: #4080ff; }
    button.action { border: none; background: #4080ff; color: #fff; border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
    button.action:hover { background: #3370e0; }
    button.icon { border: 1px solid #e3e6ea; background: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
    button.icon:hover { background: #f2f3f5; }
    #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #1d2129; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 10; }
    @media (max-width: 800px) {
        #board { grid-template-columns: 1fr; overflow-y: auto; }
        .col { max-height: 33vh; }
        .item img { max-height: 180px; }
    }
</style>
</head>
<body>
<div id="board">
    <section class="col" id="col-txt">
        <div class="col-head">TXT</div>
        <div class="col-body"><div class="empty">暂无</div></div>
    </section>
    <section class="col" id="col-image">
        <div class="col-head">IMAGE</div>
        <div class="col-body"><div class="empty">暂无</div></div>
    </section>
    <section class="col" id="col-file">
        <div class="col-head">FILE</div>
        <div class="col-body"><div class="empty">暂无</div></div>
    </section>
</div>
<footer>
    <textarea id="input" rows="1" placeholder="输入内容，回车发送，Shift+回车换行"></textarea>
    <button class="icon" id="btnImage" title="发送图片">图片</button>
    <button class="icon" id="btnFile" title="发送文件">文件</button>
    <button class="action" id="btnSend">发送</button>
    <input type="file" id="fileImage" accept="image/*" style="display:none">
    <input type="file" id="fileAny" style="display:none">
</footer>
<div id="toast"></div>
<script>
(function () {
    const MAX_FILE_BYTES = 25 * 1024 * 1024;
    const roomName = decodeURIComponent(location.pathname.replace(/^\/room\//, '')).replace(/\/+$/, '');
    const sender = (crypto.randomUUID) ? crypto.randomUUID() : 'client-' + Math.random().toString(36).slice(2);

    const cols = {
        text: document.getElementById('col-txt').querySelector('.col-body'),
        image: document.getElementById('col-image').querySelector('.col-body'),
        file: document.getElementById('col-file').querySelector('.col-body')
    };
    const inputEl = document.getElementById('input');
    const toastEl = document.getElementById('toast');
    const fileImageEl = document.getElementById('fileImage');
    const fileAnyEl = document.getElementById('fileAny');

    let es = null;

    function connect() {
        es = new EventSource('/room/' + encodeURIComponent(roomName) + '/events');
        es.addEventListener('snapshot', function (e) {
            const messages = JSON.parse(e.data);
            Object.keys(cols).forEach(function (t) {
                cols[t].innerHTML = '<div class="empty">暂无</div>';
            });
            messages.forEach(render);
        });
        es.addEventListener('message', function (e) {
            const data = JSON.parse(e.data);
            if (data.op === 'add' || data.op === 'update') upsert(data.message);
            else if (data.op === 'delete') remove(data.message.id);
        });
    }

    function emptyCol(t) {
        if (!cols[t].querySelector('.item')) {
            cols[t].innerHTML = '<div class="empty">暂无</div>';
        }
    }

    function delButton(id) {
        const btn = document.createElement('button');
        btn.className = 'del';
        btn.textContent = '删除';
        btn.addEventListener('click', function () { sendOp({ op: 'delete', id: id }); });
        return btn;
    }

    function render(m) {
        const col = cols[m.type];
        if (!col) return;
        const item = document.createElement('div');
        item.className = 'item';
        item.dataset.id = m.id;

        const meta = document.createElement('div');
        meta.className = 'meta';
        const senderEl = document.createElement('span');
        senderEl.className = 'sender';
        senderEl.textContent = (m.sender === sender) ? '你' : '其他用户';
        const ts = document.createElement('span');
        ts.textContent = ' ' + new Date(m.createdAt).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        meta.appendChild(senderEl);
        meta.appendChild(ts);
        item.appendChild(meta);

        const body = document.createElement('div');
        if (m.type === 'text') {
            body.className = 'text';
            body.textContent = m.content;
        } else if (m.type === 'image') {
            const a = document.createElement('a');
            a.href = m.url;
            a.target = '_blank';
            const img = document.createElement('img');
            img.src = m.url;
            img.loading = 'lazy';
            img.alt = m.name || 'image';
            a.appendChild(img);
            body.appendChild(a);
        } else if (m.type === 'file') {
            const fname = document.createElement('div');
            fname.className = 'fname';
            fname.textContent = m.name;
            const fsize = document.createElement('div');
            fsize.className = 'fsize';
            fsize.textContent = formatSize(m.size);
            body.appendChild(fname);
            body.appendChild(fsize);
        }
        const row = document.createElement('div');
        row.className = 'row';
        row.appendChild(body);
        const actions = document.createElement('div');
        actions.className = 'actions';
        if (m.type === 'text') {
            actions.appendChild(actionButton('复制', function () { copyText(m.content); }));
        } else if (m.type === 'image') {
            actions.appendChild(actionButton('复制', function () { copyImage(m.url); }));
        } else if (m.type === 'file') {
            actions.appendChild(actionButton('下载', function () { downloadFile(m.url, m.name); }));
        }
        actions.appendChild(delButton(m.id));
        row.appendChild(actions);
        item.appendChild(row);

        const empty = col.querySelector('.empty');
        if (empty) empty.remove();
        col.appendChild(item);
    }

    function actionButton(label, handler) {
        const btn = document.createElement('button');
        btn.textContent = label;
        btn.addEventListener('click', handler);
        return btn;
    }

    function upsert(m) {
        const col = cols[m.type];
        if (!col) return;
        const existing = col.querySelector('.item[data-id="' + m.id + '"]');
        if (existing) {
            const textEl = existing.querySelector('.text');
            if (textEl) textEl.textContent = m.content;
            return;
        }
        render(m);
    }

    function remove(id) {
        const el = document.querySelector('.item[data-id="' + id + '"]');
        if (!el) return;
        const col = el.parentNode;
        el.remove();
        emptyCol(col.id === 'col-txt' ? 'text' : (col.id === 'col-image' ? 'image' : 'file'));
    }

    function copyText(t) {
        navigator.clipboard.writeText(t).then(function () { toast('已复制'); }).catch(function () { toast('复制失败'); });
    }

    async function copyImage(url) {
        try {
            const res = await fetch(url);
            const blob = await res.blob();
            const type = blob.type || 'image/png';
            await navigator.clipboard.write([new ClipboardItem({ [type]: blob })]);
            toast('已复制图片');
        } catch (e) {
            try {
                await navigator.clipboard.writeText(url);
                toast('已复制图片地址');
            } catch (e2) {
                toast('复制失败');
            }
        }
    }

    function downloadFile(url, name) {
        const a = document.createElement('a');
        a.href = url;
        a.download = name || 'file';
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    async function sendOp(payload) {
        payload.sender = sender;
        try {
            const res = await fetch('/room/' + encodeURIComponent(roomName) + '/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                const data = await res.json().catch(function () { return {}; });
                toast(data.error || '操作失败');
            }
        } catch (e) {
            toast('网络错误');
        }
    }

    function sendText() {
        const content = inputEl.value.trim();
        if (!content) return;
        inputEl.value = '';
        inputEl.style.height = 'auto';
        sendOp({ op: 'add', type: 'text', content: content });
    }

    inputEl.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' && !ev.shiftKey) {
            ev.preventDefault();
            sendText();
        }
    });
    inputEl.addEventListener('input', function () {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    });
    document.getElementById('btnSend').addEventListener('click', sendText);
    document.getElementById('btnImage').addEventListener('click', function () { fileImageEl.click(); });
    document.getElementById('btnFile').addEventListener('click', function () { fileAnyEl.click(); });
    fileImageEl.addEventListener('change', function (e) {
        const file = e.target.files[0];
        e.target.value = '';
        if (file) uploadFile(file, 'image');
    });
    fileAnyEl.addEventListener('change', function (e) {
        const file = e.target.files[0];
        e.target.value = '';
        if (file) uploadFile(file, 'file');
    });

    async function uploadFile(file, type) {
        if (file.size > MAX_FILE_BYTES) { toast('文件不能超过 25MB'); return; }
        let b64;
        try {
            b64 = await readAsBase64(file);
        } catch (e) {
            toast('读取文件失败');
            return;
        }
        sendOp({ op: 'add', type: type, content: b64, name: file.name, mime: file.type || 'application/octet-stream' });
    }

    function readAsBase64(file) {
        return new Promise(function (resolve, reject) {
            const reader = new FileReader();
            reader.onload = function () { resolve(String(reader.result).split(',')[1]); };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function formatSize(n) {
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
        return (n / 1024 / 1024).toFixed(1) + ' MB';
    }

    let toastTimer;
    function toast(msg) {
        toastEl.textContent = msg;
        toastEl.style.display = 'block';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.style.display = 'none'; }, 2500);
    }

    window.addEventListener('beforeunload', function () { if (es) es.close(); });

    connect();
})();
</script>
</body>
</html>
