<!DOCTYPE html>
<html lang="en">
<head>  
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
    #statics { flex-shrink: 0; margin: 16px 16px 0; background: #fff; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.06); padding: 10px 14px; display: flex; align-items: center; gap: 8px; overflow-x: auto; }
    #statics .label { font-weight: 700; font-size: 13px; color: #1d2129; letter-spacing: 1px; margin-right: 4px; flex-shrink: 0; }
    #staticChips { display: flex; gap: 8px; flex-wrap: nowrap; }
    #staticChips .none { font-size: 13px; color: #c9cdd4; white-space: nowrap; }
    .chip { flex-shrink: 0; border: 1px solid #e3e6ea; background: #f7f8fa; color: #1d2129; border-radius: 16px; padding: 4px 12px; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; cursor: pointer; white-space: nowrap; }
    .chip:hover { border-color: #4080ff; color: #4080ff; }
    .chip.add { border-style: dashed; background: #fff; color: #4080ff; font-family: inherit; font-weight: 600; }
    #board { flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; padding: 12px 16px 16px; min-height: 0; }
    .col { background: #fff; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.06); display: flex; flex-direction: column; min-height: 0; }
    .col-head { padding: 10px 14px; font-weight: 700; font-size: 13px; color: #1d2129; border-bottom: 1px solid #e3e6ea; letter-spacing: 1px; }
    .col-input { padding: 10px 12px; border-bottom: 1px solid #e3e6ea; }
    #txtInput { width: 100%; height: 90px; border: 1px solid #e3e6ea; border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.5; resize: none; outline: none; font-family: inherit; }
    #txtInput:focus { border-color: #4080ff; }
    .dropzone { height: 90px; margin: 10px 12px; border: 2px dashed #d5d8dd; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; color: #86909c; font-size: 13px; cursor: pointer; transition: border-color .15s, background .15s; }
    .dropzone:hover { border-color: #4080ff; color: #4080ff; }
    .dropzone.over { border-color: #4080ff; background: #e8f1ff; color: #4080ff; }
    .col-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .empty { text-align: center; color: #c9cdd4; font-size: 13px; margin: 20px 0; }
    .item { background: #f7f8fa; border-radius: 8px; padding: 8px 10px; position: relative; }
    .item .text { font-size: 14px; color: #1d2129; white-space: pre-wrap; word-break: break-word; }
    .item img { max-width: 100%; max-height: 220px; border-radius: 6px; display: block; cursor: zoom-in; }
    .item .fname { font-size: 13px; color: #1d2129; word-break: break-all; }
    .item .fsize { font-size: 11px; color: #86909c; margin-top: 2px; }
    .item .row { display: flex; align-items: flex-start; gap: 8px; padding-right: 64px; }
    .item .actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
    .item button { border: 1px solid #e3e6ea; background: #fff; border-radius: 6px; padding: 4px; cursor: pointer; color: #4e5969; display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
    .item button svg { display: block; }
    .item button:hover { border-color: #4080ff; color: #4080ff; }
    .item button.del:hover { border-color: #f53f3f; color: #f53f3f; }
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 5; }
    #modal.open { display: flex; }
    .modal-box { width: min(520px, 92vw); background: #fff; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.18); }
    .modal-box h2 { font-size: 16px; font-weight: 700; color: #1d2129; }
    .modal-box label { font-size: 12px; font-weight: 600; color: #4e5969; }
    .modal-box input, .modal-box textarea { width: 100%; border: 1px solid #e3e6ea; border-radius: 8px; padding: 8px 10px; font-size: 14px; outline: none; }
    .modal-box input { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .modal-box textarea { height: 160px; resize: vertical; line-height: 1.5; font-family: inherit; }
    .modal-box input:focus, .modal-box textarea:focus { border-color: #4080ff; }
    .modal-box input:disabled { background: #f2f3f5; color: #86909c; cursor: not-allowed; }
    .modal-box .hint { font-size: 12px; color: #86909c; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
    .curl-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .curl-head button { border: 1px solid #e3e6ea; background: #fff; color: #4e5969; border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; }
    .curl-head button:hover { border-color: #4080ff; color: #4080ff; }
    .modal-box pre.curl { background: #1d2129; color: #e5e6eb; border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.5; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
    .modal-actions { display: flex; gap: 8px; margin-top: 6px; }
    .modal-actions .spacer { flex: 1; }
    .modal-actions button { border: 1px solid #e3e6ea; background: #fff; color: #4e5969; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .modal-actions button:hover { border-color: #4080ff; color: #4080ff; }
    .modal-actions button.primary { background: #4080ff; border-color: #4080ff; color: #fff; }
    .modal-actions button.primary:hover { background: #2b6ad9; }
    .modal-actions button.danger:hover { border-color: #f53f3f; color: #f53f3f; }
    #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #1d2129; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 10; }
    @media (max-width: 800px) {
        #board { grid-template-columns: 1fr; overflow-y: auto; }
        .col { max-height: 34vh; }
        #col-txt { max-height: none; }
        .item img { max-height: 180px; }
    }
</style>
</head>
<body>
<div id="statics">
    <span class="label">STATIC</span>
    <div id="staticChips"><span class="none">No statics yet</span></div>
    <button type="button" class="chip add" id="addStatic">+ Add</button>
</div>
<div id="board">
    <section class="col" id="col-txt">
        <div class="col-head">TXT</div>
        <div class="col-input">
            <textarea id="txtInput" placeholder="Type text, press Enter to send"></textarea>
        </div>
        <div class="col-body"><div class="empty">Empty</div></div>
    </section>
    <section class="col" id="col-image">
        <div class="col-head">IMAGE</div>
        <div class="dropzone" id="dzImage">
            <div>Click or drag to upload images</div>
            <input type="file" id="fileImage" accept="image/*" multiple style="display:none">
        </div>
        <div class="col-body"><div class="empty">Empty</div></div>
    </section>
    <section class="col" id="col-file">
        <div class="col-head">FILE</div>
        <div class="dropzone" id="dzFile">
            <div>Click or drag to upload files</div>
            <input type="file" id="fileAny" multiple style="display:none">
        </div>
        <div class="col-body"><div class="empty">Empty</div></div>
    </section>
</div>
<div id="modal">
    <div class="modal-box" role="dialog" aria-modal="true">
        <h2 id="modalTitle">Static</h2>
        <label for="modalKey">Key</label>
        <input id="modalKey" placeholder="letters, numbers, _ - ." autocomplete="off" spellcheck="false" maxlength="128">
        <label for="modalValue">Value</label>
        <textarea id="modalValue" placeholder="value"></textarea>
        <div class="hint" id="modalHint"></div>
        <div id="modalCurlBox">
            <div class="curl-head"><label>Update via HTTP</label><button type="button" id="modalCopyCurl">Copy curl</button></div>
            <pre class="curl" id="modalCurl"></pre>
        </div>
        <div class="modal-actions">
            <button type="button" class="danger" id="modalDelete">Delete</button>
            <button type="button" id="modalCopy">Copy value</button>
            <span class="spacer"></span>
            <button type="button" id="modalCancel">Cancel</button>
            <button type="button" class="primary" id="modalSave">Save</button>
        </div>
    </div>
</div>
<div id="toast"></div>
<script>
(function () {
    const MAX_FILE_BYTES = 25 * 1024 * 1024;
    const roomName = decodeURIComponent(location.pathname.replace(/^\/room\//, '')).replace(/\/+$/, '');
    const sender = (crypto.randomUUID) ? crypto.randomUUID() : 'client-' + Math.random().toString(36).slice(2);

    const cols = {
        text: document.getElementById('col-txt').querySelector('.col-body'),
        image: document.getElementById('col-image').querySelector('.col-body'),
        file: document.getElementById('col-file').querySelector('.col-body')
    };
    const txtInputEl = document.getElementById('txtInput');
    const chipsEl = document.getElementById('staticChips');
    const modalEl = document.getElementById('modal');
    const modalTitleEl = document.getElementById('modalTitle');
    const modalKeyEl = document.getElementById('modalKey');
    const modalValueEl = document.getElementById('modalValue');
    const modalHintEl = document.getElementById('modalHint');
    const modalDeleteEl = document.getElementById('modalDelete');
    const modalCopyEl = document.getElementById('modalCopy');
    const modalCurlBoxEl = document.getElementById('modalCurlBox');
    const modalCurlEl = document.getElementById('modalCurl');
    const toastEl = document.getElementById('toast');
    const KEY_RE = /^[\p{L}\p{N}_\-.]{1,128}$/u;

    // key -> message, for text messages saved with an explicit key
    const statics = new Map();
    // { mode: 'new' } or { mode: 'edit', key, original }
    let modalState = null;
    let es = null;

    function connect() {
        es = new EventSource('/room/' + encodeURIComponent(roomName) + '/events');
        es.addEventListener('snapshot', function (e) {
            const messages = JSON.parse(e.data);
            Object.keys(cols).forEach(function (t) {
                cols[t].innerHTML = '<div class="empty">Empty</div>';
            });
            statics.clear();
            messages.forEach(render);
            renderChips();
        });
        es.addEventListener('message', function (e) {
            const data = JSON.parse(e.data);
            if (data.op === 'add' || data.op === 'update') upsert(data.message);
            else if (data.op === 'delete') remove(data.message.id);
        });
    }

    const ICON_COPY = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5v-1a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1"/></svg>';
    const ICON_TRASH = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 4h10M6.5 4V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1M5 4l.5 8.5a1 1 0 0 0 1 .9h3a1 1 0 0 0 1-.9L11 4"/></svg>';
    const ICON_DOWNLOAD = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8 2v8"/><path d="M4.5 6.5 8 10l3.5-3.5"/><path d="M3 12.5h10"/></svg>';

    function emptyCol(t) {
        if (!cols[t].querySelector('.item')) {
            cols[t].innerHTML = '<div class="empty">Empty</div>';
        }
    }

    function iconButton(icon, title, handler, isDel) {
        const btn = document.createElement('button');
        btn.title = title;
        if (isDel) btn.className = 'del';
        btn.innerHTML = icon;
        btn.addEventListener('click', handler);
        return btn;
    }

    function delButton(id) {
        return iconButton(ICON_TRASH, 'Delete', function () { sendOp({ op: 'delete', id: id }); }, true);
    }

    function actionButton(icon, title, handler) {
        return iconButton(icon, title, handler, false);
    }

    // auto-generated keys equal the id; an explicit key marks a static
    function isStatic(m) {
        return m.type === 'text' && m.key && m.key !== m.id;
    }

    function renderChips() {
        chipsEl.innerHTML = '';
        const keys = Array.from(statics.keys()).sort(function (a, b) { return a.localeCompare(b); });
        if (!keys.length) {
            const none = document.createElement('span');
            none.className = 'none';
            none.textContent = 'No statics yet';
            chipsEl.appendChild(none);
            return;
        }
        keys.forEach(function (key) {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'chip';
            chip.textContent = key;
            chip.title = 'View / edit ' + key;
            chip.addEventListener('click', function () { openEdit(key); });
            chipsEl.appendChild(chip);
        });
    }

    function staticUrl(key) {
        return '/room/' + encodeURIComponent(roomName) + '/messages/' + encodeURIComponent(key);
    }

    function curlCommand(key) {
        return "curl -X PUT '" + location.origin + staticUrl(key) + "' \\\n" +
            "  -H 'Content-Type: application/json' \\\n" +
            "  -d '{\"content\": \"new value\"}'";
    }

    function openModal() {
        modalEl.classList.add('open');
    }

    function closeModal() {
        modalEl.classList.remove('open');
        modalState = null;
    }

    function openNew() {
        modalState = { mode: 'new' };
        modalTitleEl.textContent = 'New static';
        modalKeyEl.disabled = false;
        modalKeyEl.value = '';
        modalValueEl.value = '';
        modalHintEl.textContent = 'The key cannot be changed after it is saved.';
        modalDeleteEl.style.display = 'none';
        modalCopyEl.style.display = 'none';
        modalCurlBoxEl.style.display = 'none';
        openModal();
        modalKeyEl.focus();
    }

    function openEdit(key) {
        const m = statics.get(key);
        if (!m) return;
        modalState = { mode: 'edit', key: key, original: m.content };
        modalTitleEl.textContent = 'Static';
        modalKeyEl.disabled = true;
        modalKeyEl.value = key;
        modalValueEl.value = m.content;
        modalHintEl.textContent = 'GET ' + location.origin + staticUrl(key);
        modalDeleteEl.style.display = '';
        modalCopyEl.style.display = '';
        modalCurlEl.textContent = curlCommand(key);
        modalCurlBoxEl.style.display = '';
        openModal();
        modalValueEl.focus();
    }

    async function saveModal() {
        if (!modalState) return;
        const content = modalValueEl.value.trim();
        if (modalState.mode === 'new') {
            const key = modalKeyEl.value.trim();
            if (!KEY_RE.test(key)) { toast('Key may only use letters, numbers, _ - . (max 128)'); return; }
            if (statics.has(key)) { toast('Key "' + key + '" already exists'); return; }
            if (!content) { toast('Please fill in a value'); return; }
            if (await sendOp({ op: 'add', type: 'text', content: content, key: key })) {
                closeModal();
                toast('Saved. GET ' + staticUrl(key));
            }
            return;
        }
        const m = statics.get(modalState.key);
        if (!m) { closeModal(); return; }
        if (!content) { toast('Value cannot be empty'); return; }
        if (content === m.content) { closeModal(); return; }
        if (await sendOp({ op: 'update', id: m.id, content: content })) {
            closeModal();
            toast('Saved');
        }
    }

    async function deleteFromModal() {
        if (!modalState || modalState.mode !== 'edit') return;
        const m = statics.get(modalState.key);
        if (!m || !confirm('Delete static "' + m.key + '"?')) return;
        if (await sendOp({ op: 'delete', id: m.id })) closeModal();
    }

    document.getElementById('addStatic').addEventListener('click', openNew);
    document.getElementById('modalSave').addEventListener('click', saveModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    modalDeleteEl.addEventListener('click', deleteFromModal);
    modalCopyEl.addEventListener('click', function () { copyText(modalValueEl.value); });
    document.getElementById('modalCopyCurl').addEventListener('click', function () { copyText(modalCurlEl.textContent); });
    modalEl.addEventListener('click', function (e) { if (e.target === modalEl) closeModal(); });
    document.addEventListener('keydown', function (e) {
        if (!modalState) return;
        if (e.key === 'Escape') closeModal();
        else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveModal(); }
    });

    function render(m) {
        if (isStatic(m)) {
            statics.set(m.key, m);
            return;
        }
        const col = cols[m.type];
        if (!col) return;
        const item = document.createElement('div');
        item.className = 'item';
        item.dataset.id = m.id;
        item.dataset.time = m.createdAt || 0;

        const body = document.createElement('div');
        if (m.type === 'text') {
            const textEl = document.createElement('div');
            textEl.className = 'text';
            textEl.textContent = m.content;
            body.appendChild(textEl);
        } else if (m.type === 'image') {
            const a = document.createElement('a');
            a.href = m.url;
            a.target = '_blank';
            const img = document.createElement('img');
            img.src = m.url;
            img.loading = 'lazy';
            img.alt = m.name || 'image';
            a.appendChild(img);
            body.appendChild(a);
        } else if (m.type === 'file') {
            const fname = document.createElement('div');
            fname.className = 'fname';
            fname.textContent = m.name;
            const fsize = document.createElement('div');
            fsize.className = 'fsize';
            fsize.textContent = formatSize(m.size);
            body.appendChild(fname);
            body.appendChild(fsize);
        }

        const row = document.createElement('div');
        row.className = 'row';
        row.appendChild(body);
        const actions = document.createElement('div');
        actions.className = 'actions';
        if (m.type === 'text') {
            actions.appendChild(actionButton(ICON_COPY, 'Copy', function () {
                const textEl = item.querySelector('.text');
                copyText(textEl ? textEl.textContent : m.content);
            }));
        } else if (m.type === 'image') {
            actions.appendChild(actionButton(ICON_COPY, 'Copy', function () { copyImage(m.url); }));
        } else if (m.type === 'file') {
            actions.appendChild(actionButton(ICON_DOWNLOAD, 'Download', function () { downloadFile(m.url, m.name); }));
        }
        actions.appendChild(delButton(m.id));
        row.appendChild(actions);
        item.appendChild(row);

        const empty = col.querySelector('.empty');
        if (empty) empty.remove();
        col.appendChild(item);
        sortColumn(col);
    }

    function sortColumn(col) {
        const items = Array.prototype.slice.call(col.querySelectorAll('.item'));
        items.sort(function (a, b) { return Number(b.dataset.time) - Number(a.dataset.time); });
        items.forEach(function (it) { col.appendChild(it); });
    }

    function upsert(m) {
        if (isStatic(m)) {
            const isNew = !statics.has(m.key);
            statics.set(m.key, m);
            if (isNew) renderChips();
            // refresh an open popup unless the user has started editing it
            if (modalState && modalState.mode === 'edit' && modalState.key === m.key && modalValueEl.value === modalState.original) {
                modalValueEl.value = m.content;
                modalState.original = m.content;
            }
            return;
        }
        const col = cols[m.type];
        if (!col) return;
        const existing = col.querySelector('.item[data-id="' + m.id + '"]');
        if (existing) {
            const textEl = existing.querySelector('.text');
            if (textEl) textEl.textContent = m.content;
            return;
        }
        render(m);
    }

    function remove(id) {
        for (const [key, m] of statics) {
            if (m.id !== id) continue;
            statics.delete(key);
            renderChips();
            if (modalState && modalState.mode === 'edit' && modalState.key === key) {
                closeModal();
                toast('Static "' + key + '" was deleted');
            }
            return;
        }
        const el = document.querySelector('.item[data-id="' + id + '"]');
        if (!el) return;
        const col = el.parentNode;
        el.remove();
        emptyCol(col.id === 'col-txt' ? 'text' : (col.id === 'col-image' ? 'image' : 'file'));
    }

    function copyText(t) {
        navigator.clipboard.writeText(t).then(function () { toast('Copied'); }).catch(function () { toast('Copy failed'); });
    }

    async function copyImage(url) {
        try {
            const res = await fetch(url);
            const blob = await res.blob();
            const type = blob.type || 'image/png';
            await navigator.clipboard.write([new ClipboardItem({ [type]: blob })]);
            toast('Image copied');
        } catch (e) {
            try {
                await navigator.clipboard.writeText(url);
                toast('Image URL copied');
            } catch (e2) {
                toast('Copy failed');
            }
        }
    }

    function downloadFile(url, name) {
        const a = document.createElement('a');
        a.href = url;
        a.download = name || 'file';
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    async function sendOp(payload) {
        payload.sender = sender;
        try {
            const res = await fetch('/room/' + encodeURIComponent(roomName) + '/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                const data = await res.json().catch(function () { return {}; });
                toast(data.error || 'Request failed');
                return false;
            }
            return true;
        } catch (e) {
            toast('Network error');
            return false;
        }
    }

    function sendText() {
        const content = txtInputEl.value.trim();
        if (!content) return;
        txtInputEl.value = '';
        txtInputEl.style.height = '';
        sendOp({ op: 'add', type: 'text', content: content });
    }

    txtInputEl.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' && !ev.shiftKey) {
            ev.preventDefault();
            sendText();
        }
    });

    function bindDropZone(zoneEl, inputEl, accept) {
        let counter = 0;
        zoneEl.addEventListener('click', function () { inputEl.click(); });
        zoneEl.addEventListener('dragenter', function (e) { e.preventDefault(); counter++; zoneEl.classList.add('over'); });
        zoneEl.addEventListener('dragover', function (e) { e.preventDefault(); });
        zoneEl.addEventListener('dragleave', function () { counter = Math.max(0, counter - 1); if (counter === 0) zoneEl.classList.remove('over'); });
        zoneEl.addEventListener('drop', function (e) {
            e.preventDefault();
            counter = 0;
            zoneEl.classList.remove('over');
            const files = Array.prototype.slice.call(e.dataTransfer.files).filter(function (f) {
                return !accept || f.type.indexOf('image/') === 0;
            });
            if (!files.length) { toast('Please drop image files'); return; }
            files.forEach(function (f) { uploadFile(f, accept ? 'image' : 'file'); });
        });
        inputEl.addEventListener('change', function (e) {
            const files = Array.prototype.slice.call(e.target.files);
            e.target.value = '';
            files.forEach(function (f) { uploadFile(f, accept ? 'image' : 'file'); });
        });
    }

    bindDropZone(document.getElementById('dzImage'), document.getElementById('fileImage'), true);
    bindDropZone(document.getElementById('dzFile'), document.getElementById('fileAny'), false);

    // prevent the browser from opening files dropped outside the zones
    ['dragover', 'drop'].forEach(function (ev) {
        window.addEventListener(ev, function (e) {
            if (!e.target.closest || !e.target.closest('.dropzone')) e.preventDefault();
        });
    });

    async function uploadFile(file, type) {
        if (file.size > MAX_FILE_BYTES) { toast('File must be 25MB or smaller'); return; }
        let b64;
        try {
            b64 = await readAsBase64(file);
        } catch (e) {
            toast('Failed to read file');
            return;
        }
        sendOp({ op: 'add', type: type, content: b64, name: file.name, mime: file.type || 'application/octet-stream' });
    }

    function readAsBase64(file) {
        return new Promise(function (resolve, reject) {
            const reader = new FileReader();
            reader.onload = function () { resolve(String(reader.result).split(',')[1]); };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function formatSize(n) {
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
        return (n / 1024 / 1024).toFixed(1) + ' MB';
    }

    let toastTimer;
    function toast(msg) {
        toastEl.textContent = msg;
        toastEl.style.display = 'block';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.style.display = 'none'; }, 2500);
    }

    window.addEventListener('beforeunload', function () { if (es) es.close(); });

    connect();
})();
</script>
</body>
</html>
